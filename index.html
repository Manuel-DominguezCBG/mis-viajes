<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Manuel in Movement</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { --bg:#12151c; --panel:rgba(20,24,33,.92); --fg:#e8ecf4; --muted:#96a0b5; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
              font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #map { position:absolute; inset:0; }
  .panel { position:absolute; z-index:1000; background:var(--panel); backdrop-filter:blur(12px);
           border:1px solid rgba(255,255,255,.09); border-radius:14px; padding:14px 16px;
           box-shadow:0 8px 32px rgba(0,0,0,.45); }
  #stats { top:14px; left:14px; width:250px; }
  #plegar { display:none; position:absolute; top:9px; right:9px; width:30px; height:30px;
            border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.07);
            color:var(--fg); border-radius:9px; cursor:pointer; font-size:13px; line-height:1;
            align-items:center; justify-content:center; }
  #plegar .chevron { transition:transform .18s; }
  #stats:not(.abierto) #plegar .chevron { transform:rotate(-90deg); }
  .resumen { display:none; font-variant-numeric:tabular-nums; font-size:13px;
             color:var(--muted); margin-top:9px; }
  #stats h1 { margin:0 0 2px; font-size:16px; letter-spacing:-.2px; }
  .rotulo { text-align:center; pointer-events:none; white-space:nowrap;
            text-shadow:0 2px 22px rgba(0,0,0,.9), 0 0 6px rgba(0,0,0,.7); }
  .rotulo .nombre { font-size:25px; font-weight:600; letter-spacing:.20em;
                    text-transform:uppercase; color:rgba(255,255,255,.88); line-height:1.22; }
  .rotulo .nombre em { font-style:normal; color:rgba(255,140,90,.92); }
  .rotulo .filete { height:1px; background:rgba(255,255,255,.30); margin:10px 30px 8px; }
  .rotulo .rango { font-size:10.5px; letter-spacing:.28em; text-transform:uppercase;
                   color:rgba(255,255,255,.5); }
  @media (max-width:900px) { .rotulo .nombre { font-size:16px; letter-spacing:.14em; }
                             .rotulo .rango { font-size:8px; letter-spacing:.2em; }
                             .rotulo .filete { margin:7px 34px 6px; } }
  #stats .sub { color:var(--muted); font-size:12px; margin-bottom:12px; }
  .kpis { display:grid; grid-template-columns:1fr 1fr; gap:10px 8px; margin-bottom:14px; }
  .kpi b { display:block; font-size:20px; font-weight:650; letter-spacing:-.5px; }
  .kpi span { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
  .modes { display:flex; flex-direction:column; gap:5px; }
  .mode { display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none;
          padding:3px 5px; border-radius:7px; transition:background .15s; }
  .mode:hover { background:rgba(255,255,255,.06); }
  .mode.off { opacity:.35; }
  .swatch { width:12px; height:4px; border-radius:2px; flex:0 0 auto; }
  .mode .km { margin-left:auto; color:var(--muted); font-variant-numeric:tabular-nums; font-size:12px; }
  .extras { margin-top:9px; padding-top:9px; border-top:1px solid rgba(255,255,255,.09); }
  .dot { width:9px; height:9px; border-radius:50%; flex:0 0 auto; }
  .pop-img { display:block; width:230px; max-width:60vw; border-radius:8px; margin:7px 0 5px; }
  .camara {
    width:14px; height:14px; border-radius:50%; background:#f7f3ea; color:#1b1f27;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,.5); border:1px solid rgba(255,255,255,.9);
    transition:transform .12s;
  }
  .camara:hover { transform:scale(1.45); }
  .camara svg { width:8.5px; height:8.5px; }
  #visor {
    position:fixed; inset:0; z-index:3000; background:rgba(8,10,14,.94);
    display:none; align-items:center; justify-content:center; flex-direction:column;
    gap:14px; padding:26px; cursor:zoom-out;
  }
  #visor.abierto { display:flex; }
  #visor img { max-width:min(1100px,92vw); max-height:78vh; object-fit:contain;
               border:1px solid rgba(255,255,255,.14); box-shadow:0 20px 60px rgba(0,0,0,.6); }
  #visor .info { text-align:center; color:#e8ecf4; font-size:14px; }
  #visor .info span { display:block; margin-top:5px; font-size:11px; letter-spacing:.13em;
                      text-transform:uppercase; color:#96a0b5; }
  .cartucho {
    width:212px; padding:9px 9px 0; background:rgba(16,19,26,.94);
    border:1px solid rgba(255,255,255,.16); box-shadow:0 10px 34px rgba(0,0,0,.55);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  .cartucho img { display:block; width:100%; height:142px; object-fit:cover;
                  object-position:center 58%; filter:saturate(.92) contrast(1.04);
                  border:1px solid rgba(255,255,255,.08); }
  .cartucho .pie { padding:8px 1px 12px; border-top:1px solid rgba(255,255,255,.13); margin-top:9px; }
  .cartucho .titulo { font-size:12.5px; color:#e8ecf4; letter-spacing:.02em; line-height:1.3; }
  .cartucho .sitio { display:block; margin-top:4px; font-size:9.5px; letter-spacing:.13em;
                     white-space:nowrap;
                     text-transform:uppercase; color:#8d99ae; }
  #timebar { bottom:14px; left:50%; transform:translateX(-50%); width:min(680px,calc(100% - 28px));
             display:flex; align-items:center; gap:12px; }
  #timebar input { flex:1; accent-color:#ff6b35; }
  #timebar .label { min-width:120px; font-variant-numeric:tabular-nums; }
  #timebar button { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.15);
                    color:var(--fg); border-radius:8px; padding:5px 11px; cursor:pointer; font-size:13px; }
  #timebar button:hover { background:rgba(255,255,255,.18); }
  .leaflet-popup-content-wrapper { background:#1a1f2b; color:var(--fg); border-radius:10px; }
  .leaflet-popup-tip { background:#1a1f2b; }
  .leaflet-popup-content { margin:11px 14px; font-size:13px; }
  .leaflet-popup-content b { font-size:14px; }
  .leaflet-container { background:#0b0e14; }
  .leaflet-control-attribution { background:rgba(0,0,0,.5)!important; color:#7c8598!important; }
  .leaflet-control-attribution a { color:#9aa4b8!important; }
  /* en pantallas estrechas el panel se come el Atlantico: el cartucho estorba */
  @media (max-width:1100px) { .cartucho { display:none; } }
  @media (max-width:760px) {
    body { font-size:15px; }
    #stats { width:calc(100% - 20px); left:10px; top:10px; padding:11px 13px; max-height:76vh;
             overflow-y:auto; -webkit-overflow-scrolling:touch; }
    #plegar { display:flex; }
    /* plegado por defecto en pantalla estrecha: solo se abre si lo pides */
    #stats:not(.abierto) #cuerpo { display:none; }
    #stats:not(.abierto) .resumen { display:block; }
    #stats:not(.abierto) { max-height:none; overflow:visible; }
    #stats h1 { font-size:15px; }
    .kpis { grid-template-columns:repeat(4,1fr); gap:8px 6px; margin-bottom:11px; }
    .kpi b { font-size:17px; }
    .kpi span { font-size:9.5px; letter-spacing:.3px; }
    .mode { padding:5px; }
    #timebar { width:calc(100% - 20px); max-width:none; bottom:10px; gap:8px;
               padding:9px 11px; box-sizing:border-box; }
    #timebar input { min-width:0; }
    #timebar .label { min-width:0; font-size:12.5px; white-space:nowrap; }
    #timebar button { padding:5px 9px; font-size:12.5px; }
    #plegar { background:rgba(255,255,255,.12); }
  }
</style>
</head>
<body>
<div id="map"></div>
<div id="visor"><img alt=""><div class="info"></div></div>

<div class="panel" id="stats">
  <button id="plegar" aria-expanded="true" aria-controls="cuerpo">
    <span class="chevron">▾</span>
  </button>
  <h1>Mis viajes</h1>
  <div class="sub">01/01/2006 – 16/08/2026</div>
  <div class="resumen" id="resumen"></div>
  <div id="cuerpo">
  <div class="kpis">
    <div class="kpi"><b id="k-km">–</b><span>km</span></div>
    <div class="kpi"><b id="k-tracks">–</b><span>trayectos</span></div>
    <div class="kpi"><b id="k-since">–</b><span>desde</span></div>
    <div class="kpi"><b id="k-places">–</b><span>lugares</span></div>
  </div>
  <div class="modes" id="modes"></div>
  <div class="modes extras" id="extras"></div>
  </div>
</div>

<div class="panel" id="timebar">
  <button id="play">▶</button>
  <input type="range" id="slider" min="0" max="0" value="0">
  <div class="label" id="monthLabel">Todo</div>
  <button id="reset">Todo</button>
</div>

const LABELS = {"MOTORCYCLING": "Moto", "IN_PASSENGER_VEHICLE": "Coche", "WALKING": "A pie", "CYCLING": "Bici", "IN_TRAIN": "Tren", "IN_BUS": "Bus", "FLYING": "Avion", "IN_FERRY": "Ferry", "UNKNOWN": "Otro"};

const map = L.map('map', { preferCanvas:true, zoomControl:true, worldCopyJump:true });
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution:'&copy; OpenStreetMap &copy; CARTO', maxZoom:19, subdomains:'abcd'
}).addTo(map);

const routeLayer = L.layerGroup().addTo(map);
const visitLayer = L.layerGroup().addTo(map);
const photoLayer = L.layerGroup().addTo(map);
const handLayer = L.layerGroup().addTo(map);
const stayLayer = L.layerGroup().addTo(map);
const albumLayer = L.layerGroup().addTo(map);
const enabled = new Set(Object.keys(COLORS));
const extrasOn = new Set(['hand', 'album', 'photos', 'stays', 'labels']);
let month = null;   // null = todo

const fmt = n => n.toLocaleString('es-ES', {maximumFractionDigits:0});
const inMonth = m => month === null || m === month;

function draw() {
  routeLayer.clearLayers();
  visitLayer.clearLayers();
  photoLayer.clearLayers();
  handLayer.clearLayers();
  stayLayer.clearLayers();
  albumLayer.clearLayers();

  let km = 0, n = 0; const days = new Set(); const perMode = {}; const perModeN = {};

  DATA.tracks.forEach(t => {
    if (!enabled.has(t.mode) || !inMonth(t.month)) return;
    km += t.km; n++; days.add(t.start.slice(0,10));
    perMode[t.mode] = (perMode[t.mode] || 0) + t.km;
    perModeN[t.mode] = (perModeN[t.mode] || 0) + 1;
    const line = L.polyline(t.coords, {
      color: COLORS[t.mode], weight: t.mode === 'FLYING' ? 1.6 : 2.4,
      opacity: .82, dashArray: t.mode === 'FLYING' ? '5,6' : null, lineJoin:'round'
    });
    line.bindPopup(
      `<b>${LABELS[t.mode]}</b><br>${t.km} km · ${t.kmh} km/h medios<br>` +
      `${t.start.replace('T',' ')} → ${t.end.slice(11)}`
    );
    line.on('mouseover', () => line.setStyle({weight:5, opacity:1}));
    line.on('mouseout',  () => line.setStyle({weight: t.mode==='FLYING'?1.6:2.4, opacity:.82}));
    routeLayer.addLayer(line);
  });

  let places = 0;
  DATA.visits.forEach(v => {
    if (month !== null && !v.months.includes(month)) return;
    places++;
    const r = Math.min(3 + Math.sqrt(v.hours) * .85, 16);
    const home = v.label === 'HOME', work = v.label === 'WORK';
    const c = L.circleMarker([v.lat, v.lng], {
      radius: r, color: home ? '#ffd166' : work ? '#4cc9f0' : '#ffffff',
      weight: home || work ? 2 : 1, fillColor: home ? '#ffd166' : work ? '#4cc9f0' : '#dfe6f3',
      fillOpacity: .28, opacity: .75
    });
    c.bindPopup(
      `<b>${v.label ? (home ? 'Casa' : 'Trabajo') : 'Lugar'}</b><br>` +
      `${v.n} visita${v.n>1?'s':''} · ${fmt(v.hours)} h en total<br>` +
      `${v.first} → ${v.last}<br>` +
      `<a href="https://www.google.com/maps/search/?api=1&query=${v.lat},${v.lng}" target="_blank" rel="noopener">Ver en Google Maps</a>`
    );
    visitLayer.addLayer(c);
  });

  // fotos geolocalizadas (2017 en adelante) — el unico rastro anterior a 2026
  let photos = 0;
  if (extrasOn.has('photos')) DATA.photos.forEach(p => {
    if (!inMonth(p.month)) return;
    photos++;
    const m = L.circleMarker([p.lat, p.lng], {
      radius:5.5, color:'#ffd166', weight:2, fillColor:'#ffd166', fillOpacity:.5
    });
    m.bindPopup(
      `<b>${p.n > 1 ? p.n + ' fotos' : 'Foto'} · ${p.date}</b>` +
      `<img class="pop-img" src="${p.file}" loading="lazy">` +
      `<a href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}" target="_blank" rel="noopener">Ver en Google Maps</a>`
    );
    photoLayer.addLayer(m);
  });

  // rutas sin GPS: suman en su modo, pero se dibujan discontinuas para distinguirlas.
  // Sin fecha exacta, solo se ven en 'Todo' o en un mes de alguno de sus años.
  let handN = 0;
  if (extrasOn.has('hand')) DATA.handRoutes.forEach(r => {
    const year = month === null ? null : +month.slice(0,4);
    if (year !== null && !r.years.includes(year)) return;
    if (!enabled.has(r.mode)) return;
    km += r.km; n++; handN++;
    perMode[r.mode] = (perMode[r.mode] || 0) + r.km;
    perModeN[r.mode] = (perModeN[r.mode] || 0) + 1;

    const line = L.polyline(r.coords, {
      color: COLORS[r.mode], weight: 3, opacity: .85,
      dashArray: r.mode === 'IN_FERRY' ? '3,7' : '9,6', lineJoin:'round'
    });
    const veces = r.times > 1
      ? `${r.times} veces${r.roundTrip ? ' ida y vuelta' : ''} · ${fmt(r.kmOnce)} km cada una<br>`
      : '';
    line.bindPopup(
      `<b>${r.name}</b><br>${LABELS[r.mode]} · ~${fmt(r.km)} km<br>${veces}` +
      `${r.from} → ${r.to}<br>` +
      `<span style="color:#96a0b5">Sin GPS${r.years.length ? ' · ' + r.years.join(', ') : ''} · ` +
      `${r.snapped ? 'sigue la carretera' : 'distancia en linea recta'}</span>`
    );
    line.on('mouseover', () => line.setStyle({weight:6}));
    line.on('mouseout',  () => line.setStyle({weight:3}));
    handLayer.addLayer(line);
  });
  document.getElementById('x-hand').textContent = fmt(handN) + ' rutas';

  // album: fotos que has situado tu, con icono de camara y visor a pantalla completa
  let enAlbum = 0;
  const CAMARA = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 3l-1.5 2H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.5L15 3H9zm3 5.5A4.5 4.5 0 1 1 7.5 13 4.5 4.5 0 0 1 12 8.5zm0 2A2.5 2.5 0 1 0 14.5 13 2.5 2.5 0 0 0 12 10.5z"/></svg>';
  if (extrasOn.has('album')) DATA.album.forEach(f => {
    if (f.month && !inMonth(f.month)) return;
    enAlbum++;
    const m = L.marker([f.lat, f.lng], {
      icon: L.divIcon({ className:'', iconSize:[14,14], iconAnchor:[7,7],
                        html:`<div class="camara" title="${f.place}">${CAMARA}</div>` })
    });
    m.on('click', () => abreVisor(f));
    albumLayer.addLayer(m);
  });
  document.getElementById('x-album').textContent = fmt(enAlbum) + ' fotos';

  // hoteles del calendario: sitios donde dormiste, cuentan como lugares
  let estancias = 0;
  if (extrasOn.has('stays')) DATA.stays.forEach(h => {
    if (!inMonth(h.month)) return;
    estancias++;
    const m = L.circleMarker([h.lat, h.lng], {
      radius: 7, color: '#ffd166', weight: 2, fillColor: '#ffd166', fillOpacity: .5
    });
    m.bindPopup(`<b>${h.name}</b>` + (h.date ? `<br>Estuviste aquí · ${h.date}` : '<br>Estuviste aquí'));
    stayLayer.addLayer(m);
  });
  document.getElementById('x-stays').textContent = fmt(estancias) + ' sitios';

  document.getElementById('x-photos').textContent = fmt(photos) + ' fotos';
  document.getElementById('k-km').textContent = fmt(km);
  document.getElementById('resumen').textContent =
      `${fmt(km)} km · ${fmt(n)} trayectos · ${fmt(places + estancias)} lugares`;
  document.getElementById('k-tracks').textContent = fmt(n);
  document.getElementById('k-places').textContent = fmt(places + estancias);

  document.querySelectorAll('#modes .mode').forEach(el => {
    const m = el.dataset.mode;
    // el total del periodo, no el de un trayecto suelto: se indica cuantos suma
    el.querySelector('.km').textContent = fmt(perMode[m] || 0) + ' km';
    el.title = `${fmt(perMode[m] || 0)} km sumando ${perModeN[m] || 0} trayectos`;
    el.classList.toggle('off', !enabled.has(m));
  });
}

// leyenda / filtros por modo
const modesEl = document.getElementById('modes');
DATA.modeOrder.forEach(m => {
  const el = document.createElement('div');
  el.className = 'mode'; el.dataset.mode = m;
  el.innerHTML = `<div class="swatch" style="background:${COLORS[m]}"></div>` +
                 `<div>${LABELS[m]}</div><div class="km"></div>`;
  el.onclick = () => { enabled.has(m) ? enabled.delete(m) : enabled.add(m); draw(); };
  modesEl.appendChild(el);
});

// capas extra
const extrasEl = document.getElementById('extras');
[['hand', 'Rutas sin GPS', '#ff2d6f'], ['album', 'Álbum', '#f7f3ea'],
 ['photos', 'Fotos con GPS', '#ffd166'],
 ['stays', 'Sitios', '#ffd166']].forEach(([k, txt, col]) => {
  const el = document.createElement('div');
  el.className = 'mode'; el.dataset.extra = k;
  el.innerHTML = `<div class="dot" style="background:${col}"></div><div>${txt}</div>` +
                 `<div class="km" id="x-${k}"></div>`;
  el.onclick = () => {
    extrasOn.has(k) ? extrasOn.delete(k) : extrasOn.add(k);
    el.classList.toggle('off', !extrasOn.has(k));
    draw();
  };
  extrasEl.appendChild(el);
});

// slider temporal
const months = DATA.months;
const slider = document.getElementById('slider');
const label = document.getElementById('monthLabel');
slider.max = months.length - 1;
slider.oninput = () => { month = months[+slider.value]; label.textContent = monthName(month); draw(); };
document.getElementById('reset').onclick = () => { month = null; label.textContent = 'Todo'; draw(); };

function monthName(m) {
  const [y, mm] = m.split('-');
  return ['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
          'septiembre','octubre','noviembre','diciembre'][+mm-1] + ' ' + y;
}

// visor
const visor = document.getElementById('visor');
function abreVisor(f) {
  visor.querySelector('img').src = f.file;
  visor.querySelector('.info').innerHTML =
    (f.caption || f.place) + `<span>${[f.place, f.date].filter(Boolean).join(' · ')}</span>`;
  visor.classList.add('abierto');
}
visor.onclick = () => visor.classList.remove('abierto');
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') visor.classList.remove('abierto');
});

let timer = null;
document.getElementById('play').onclick = e => {
  if (timer) { clearInterval(timer); timer = null; e.target.textContent = '▶'; return; }
  e.target.textContent = '⏸';
  let i = 0;
  timer = setInterval(() => {
    slider.value = i; slider.oninput();
    if (++i >= months.length) { clearInterval(timer); timer = null; e.target.textContent = '▶'; }
  }, 900);
};

// cartucho en el Atlantico, donde el mapa esta vacio: es donde los mapas antiguos
// ponian el titulo. Tamaño fijo en pantalla y sin capturar clics.
// titulo sobre el Atlantico, donde el mapa no tiene nada que contar
L.marker([55.6, -21.5], {
  interactive:false, keyboard:false, zIndexOffset:-800,
  icon: L.divIcon({ className:'', iconSize:[300,120], iconAnchor:[150,60],
    html:`<div class="rotulo"><div class="nombre">Manuel<br><em>in Movement</em></div>` +
         `<div class="filete"></div><div class="rango">${DATA.rango}</div></div>` })
}).addTo(map);

if (DATA.cartucho) {
  L.marker(DATA.cartucho.at, {
    interactive: false, keyboard: false, zIndexOffset: -500,
    icon: L.divIcon({
      className: '', iconSize: [212, 232], iconAnchor: [106, 116],
      html: `<div class="cartucho"><img src="${DATA.cartucho.foto}" alt="">` +
            `<div class="pie"><div class="titulo">${DATA.cartucho.titulo}</div>` +
            `<span class="sitio">${DATA.cartucho.sitio}</span></div></div>`
    })
  }).addTo(map);
}

// el panel arranca plegado en pantalla estrecha; lo decide el CSS para que no
// dependa de que el JavaScript llegue a tiempo
const panel = document.getElementById('stats');
const botonPlegar = document.getElementById('plegar');
botonPlegar.onclick = () => {
  const abierto = panel.classList.toggle('abierto');
  botonPlegar.setAttribute('aria-expanded', String(abierto));
};
botonPlegar.setAttribute('aria-expanded', 'false');

document.getElementById('k-since').textContent = DATA.firstYear;
draw();
map.fitBounds(DATA.bounds, {padding:[40,40]});
</script>
</body>
</html>
